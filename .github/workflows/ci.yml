name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go build ./cmd/godot-mcp
      # -race на Windows требует cgo и gcc, поэтому там без него.
      - run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...

  integration:
    name: integration (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ matrix.godot }}-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - run: ~/godot/godot --headless --version
      # Тестовые фреймворки для godot_run_tests — те же версии, что в testdata.
      - name: Download GUT and gdUnit4
        run: |
          mkdir -p ~/testaddons
          curl -fsSL https://codeload.github.com/bitwes/Gut/zip/refs/tags/v9.7.1 -o /tmp/gut.zip
          curl -fsSL https://codeload.github.com/godot-gdunit-labs/gdUnit4/zip/refs/tags/v6.2.1 -o /tmp/gdunit4.zip
          unzip -q /tmp/gut.zip -d ~/testaddons
          unzip -q /tmp/gdunit4.zip -d ~/testaddons
      - name: Integration tests
        env:
          GUT_ADDON_DIR: /home/runner/testaddons/Gut-9.7.1/addons/gut
          GDUNIT4_ADDON_DIR: /home/runner/testaddons/gdUnit4-6.2.1/addons/gdUnit4
        run: GODOT_BIN="$HOME/godot/godot" go test -race -v ./...

  # Скриншоты требуют настоящего рендера: виртуальный дисплей (Xvfb) и
  # программный Vulkan (lavapipe из mesa-vulkan-drivers). Отдельная задача,
  # чтобы проблемы окружения не маскировали остальные тесты.
  screenshots:
    name: screenshots (Godot 4.6.3, Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Xvfb and software Vulkan
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-vulkan-drivers
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.6.3-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: Screenshot tests
        run: GODOT_BIN="$HOME/godot/godot" xvfb-run -a go test -v -run TestScreenshot ./internal/tools/
